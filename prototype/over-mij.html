document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;font-weight:500;padding:14px 18px;border-radius:16px;background:#FFFDFA\">Home<\u002Fa>\n        <a href=\"afspraak.html\" style=\"font-size:17px;font-weight:500;padding:14px 18px;border-radius:16px;background:#FFFDFA\">Afspraak<\u002Fa>\n        <a href=\"over-mij.html\" style=\"font-size:17px;font-weight:600;padding:14px 18px;border-radius:16px;background:#F9DDD8\">Over mij<\u002Fa>\n        <a href=\"aandoeningen.html\" style=\"font-size:17px;font-weight:500;padding:14px 18px;border-radius:16px;background:#FFFDFA\">Aandoeningen<\u002Fa>\n        <a href=\"afspraak.html\" style=\"margin-top:6px;background:#F48D99;color:#14243D;border-radius:999px;padding:16px 22px;font-size:16px;font-weight:700;text-align:center\">Maak een afspraak<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n  <section data-pad=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(36px,5vw,72px) 40px 0\">\n    <div data-two=\"\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.6fr);gap:clamp(28px,4vw,64px);align-items:center\">\n      <img src=\"6535c5f4-8983-4156-afb2-347e97f6f746\" alt=\"Dr. Irina Balikova\" style=\"width:100%;aspect-ratio:1/1;height:auto;object-fit:cover;border-radius:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:18px;min-width:0\">\n        <span style=\"display:block;font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#1B3E70\">Over mij<\u002Fspan>\n        <h1 style=\"margin:0;font-size:clamp(28px,3.4vw,44px);line-height:1.12;letter-spacing:-.025em;font-weight:700;color:#14243D;overflow-wrap:break-word;hyphens:auto\">Dr. Irina Balikova<\u002Fh1>\n        <p style=\"margin:0;font-size:clamp(18px,1.6vw,22px);line-height:1.45;color:#1B3E70;font-weight:500\">Kinderoogarts, gespecialiseerd in pediatrische en genetische oogaandoeningen.<\u002Fp>\n        <p style=\"margin:0;font-size:18px;line-height:1.65;color:#41536D\">Ik ben pediatrisch oogarts met meer dan 10 jaar ervaring in de diagnose en behandeling van oogaandoeningen bij kinderen, zoals amblyopie (lui oog), scheelzien (strabisme) en erfelijke oogaandoeningen.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;padding-top:4px\">\n          <a href=\"afspraak.html\" style=\"background:#F48D99;color:#14243D;border-radius:999px;padding:17px 30px;font-size:16px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;gap:6px\" style-hover=\"background:#EF7382\">Maak een afspraak<\u002Fa>\n          <a href=\"#publicaties\" style=\"background:#FFFDFA;color:#1B3E70;border-radius:999px;padding:17px 26px;font-size:16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center\" style-hover=\"background:#F9DDD8\">Onderzoek en publicaties<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section data-pad=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(40px,5vw,64px) 40px 0\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n      <div style=\"background:#FFFDFA;border-radius:28px;padding:26px 28px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:clamp(22px,2vw,26px);line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#14243D\">10+ jaar<\u002Fspan><span style=\"font-size:17px;line-height:1.5;color:#41536D\">ervaring in kinderoogheelkunde<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#FFFDFA;border-radius:28px;padding:26px 28px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:clamp(22px,2vw,26px);line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#14243D\">Doctoraat<\u002Fspan><span style=\"font-size:17px;line-height:1.5;color:#41536D\">behaald aan KU Leuven<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#FFFDFA;border-radius:28px;padding:26px 28px;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:clamp(22px,2vw,26px);line-height:1.2;font-weight:600;letter-spacing:-.01em;color:#14243D\">Europees diploma<\u002Fspan><span style=\"font-size:17px;line-height:1.5;color:#41536D\">pediatrische oogheelkunde en strabisme<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section data-pad=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) 40px 0\">\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:44em;margin-bottom:34px\">\n      <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,46px);line-height:1.08;letter-spacing:-.02em;font-weight:700;color:#14243D;overflow-wrap:break-word\">Wat ik behandel<\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.65;color:#41536D\">Mijn klinische activiteit omvat zowel behandeling zonder operatie als strabismuschirurgie, met aandacht voor een optimale visuele ontwikkeling.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px\">\n      <div style=\"background:#FFFDFA;border-radius:28px;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:14px\">\n        <span style=\"display:block;font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#1B3E70\">Zonder operatie<\u002Fspan>\n        <h3 style=\"margin:0;font-size:clamp(20px,1.7vw,26px);font-weight:700;color:#14243D\">Brilcorrectie en amblyopietherapie<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#5B6C85\">Behandeling met brilcorrectie en amblyopietherapie (lui oog), met aandacht voor een optimale visuele ontwikkeling van uw kind.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFDFA;border-radius:28px;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:14px\">\n        <span style=\"display:block;font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#1B3E70\">Chirurgie<\u002Fspan>\n        <h3 style=\"margin:0;font-size:clamp(20px,1.7vw,26px);font-weight:700;color:#14243D\">Strabismuschirurgie<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#5B6C85\">Operatieve correctie van scheelzien (strabisme) bij kinderen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section data-pad=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) 40px 0\">\n    <div style=\"background:#BFE3E0;border-radius:16px;padding:clamp(28px,4vw,60px)\">\n      <div data-sechead=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px\">\n        <div style=\"max-width:36em;display:flex;flex-direction:column;gap:14px\">\n          <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,46px);line-height:1.08;letter-spacing:-.02em;font-weight:700;color:#14243D;overflow-wrap:break-word\">Opleiding en ervaring<\u002Fh2>\n          <p style=\"margin:0;font-size:18px;line-height:1.6;color:#14243D\">Opgebouwd in universitaire centra en kinderziekenhuizen, met een verdere specialisatie in kinderoogheelkunde.<\u002Fp>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n      <div data-tl=\"\" style=\"display:flex;flex-direction:column\">\n        <div style=\"display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid rgba(27,62,112,.14)\"><span style=\"font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#1B3E70;padding-top:3px\">Ziekenhuizen<\u002Fspan><div style=\"font-size:17px;line-height:1.6;color:#14243D\">Kinderziekenhuis Koningin Fabiola, Erasme ziekenhuis (ULB), UZ Gent en UZ Leuven<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid rgba(27,62,112,.14)\"><span style=\"font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#1B3E70;padding-top:3px\">Specialisatie<\u002Fspan><div style=\"font-size:17px;line-height:1.6;color:#14243D\"><div style=\"display:flex;flex-wrap:wrap;gap:8px\"><span style=\"background:rgba(255,253,250,.5);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:#41536D\">Kinderoogheelkunde<\u002Fspan><span style=\"background:rgba(255,253,250,.5);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:#41536D\">Strabismechirurgie<\u002Fspan><span style=\"background:rgba(255,253,250,.5);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:#41536D\">Elektrofysiologie<\u002Fspan><span style=\"background:rgba(255,253,250,.5);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:#41536D\">Oftalmogenetica<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid rgba(27,62,112,.14)\"><span style=\"font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#1B3E70;padding-top:3px\">Doctoraat<\u002Fspan><div style=\"font-size:17px;line-height:1.6;color:#14243D\">KU Leuven<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid rgba(27,62,112,.14)\"><span style=\"font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#1B3E70;padding-top:3px\">Postuniversitair<\u002Fspan><div style=\"font-size:17px;line-height:1.6;color:#14243D\">Tweejarige opleiding pediatrische oogheelkunde en strabisme (DIU, SFO, Parijs)<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid rgba(27,62,112,.14)\"><span style=\"font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#1B3E70;padding-top:3px\">Europees diploma<\u002Fspan><div style=\"font-size:17px;line-height:1.6;color:#14243D\">Pediatrische oogheelkunde en strabisme<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section data-pad=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) 40px 0\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px 48px;max-width:980px;margin:0 auto;text-align:left\">\n      <img src=\"9b17fcb1-3028-4e51-8029-0bdc4aa158de\" alt=\"\" style=\"width:clamp(110px,12vw,170px);height:auto;flex:0 0 auto;animation:bob 8s ease-in-out infinite\">\n      <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"display:block;font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#1B3E70\">Mijn aanpak<\u002Fspan>\n        <p style=\"margin:0;font-size:clamp(22px,2.4vw,32px);line-height:1.35;letter-spacing:-.01em;font-weight:600;color:#14243D\">Ik benader elk kind op een rustige en respectvolle manier, met aandacht voor zowel het kind als de ouders.<\u002Fp>\n        <p style=\"margin:0;font-size:18px;line-height:1.65;color:#41536D\">Kinderen begeleiden in hun visuele ontwikkeling en vertrouwen opbouwen vormen voor mij een essentieel onderdeel van mijn werk.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section id=\"publicaties\" data-pad=\"\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) 40px 0;scroll-margin-top:120px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(24px,4vw,56px);align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <h2 style=\"margin:0;font-size:clamp(28px,3.4vw,46px);line-height:1.08;letter-spacing:-.02em;font-weight:700;color:#14243D;overflow-wrap:break-word\">Onderzoek en publicaties<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.65;color:#41536D\">Mijn klinische activiteit wordt ondersteund door wetenschappelijk onderzoek, met publicaties in internationale, peer-reviewed tijdschriften binnen de oftalmologie en genetica.<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#5B6C85\">Daarnaast volg ik regelmatig cursussen, congressen en observerships, om de meest actuele inzichten en technieken in de praktijk toe te passen.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"https://pubmed.ncbi.nlm.nih.gov/?term=Balikova+I\" target=\"_blank\" rel=\"noopener\" style=\"background:#FFFDFA;border-radius:28px;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:12px\" style-hover=\"background:#F9DDD8\">\n        <span style=\"display:block;font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#1B3E70\">PubMed<\u002Fspan>\n        <h3 style=\"margin:0;font-size:21px;font-weight:600;line-height:1.28;color:#14243D\">Wetenschappelijke publicaties<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#5B6C85\">Overzicht van peer-reviewed artikels in oftalmologie en genetica.<\u002Fp>\n        <span style=\"font-size:16px;color:#1B3E70;padding-top:6px\"><u>Bekijk op PubMed<\u002Fu>↗<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section data-pad=\"\" style=\"max-width: 1280px; margin: 0 auto; padding: clamp(56px,7vw,96px) 40px 0\">\n    \n  <div style=\"border-radius: 36px; padding: 36px clamp(24px,4.6vw,60px) 60px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%\">\n      \n      <img src=\"f76effb0-293e-430f-b8bc-b58dc4f4b2d6\" alt=\"\" style=\"width: 106px; animation: bob 5.5s ease-in-out infinite; height: 120px; position: static; margin: 0 auto 4px\"><h2 style=\"margin:0;font-size:clamp(28px,3.4vw,46px);line-height:1.06;letter-spacing:-.02em;font-weight:700;color:#14243D;overflow-wrap:break-word;max-width:20em\">Klaar om een afspraak te maken?<\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.6;color:#1B3E70;max-width:30em\">Kies de kliniek die het best past en boek rechtstreeks online. Heeft u een vraag? Bel gerust de praktijk.<\u002Fp>\n      <a href=\"afspraak.html\" style=\"background:#1B3E70;color:#FFFDFA;border-radius:999px;padding:19px 36px;font-size:17px;font-weight:600;min-height:44px;display:flex;align-items:center;margin-top:6px\" style-hover=\"background:#14243D\">Maak een afspraak<\u002Fa>\n      <a href=\"faq.html\" data-ctafaq=\"\" style=\"display:inline-flex;align-items:center;min-height:44px;font-size:16px;color:#1B3E70;text-decoration:underline;text-underline-offset:3px\">Of bekijk eerst de veelgestelde vragen<\u002Fa>\n    <\u002Fdiv><\u002Fsection>\n  <div style=\"height:clamp(40px,5vw,72px)\"><\u002Fdiv>\n  <footer data-pad=\"\" style=\"background: #FFFDFA; padding: 60px 40px 40px; padding-right: 40px; display: block\">\n    <div data-foot=\"\" data-footlocs=\"\" style=\"max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:36px\">\n      <div style=\"max-width:24em\">\n        <img src=\"a132fefa-ad18-4fa9-97cb-d248ac9fed29\" alt=\"Pediatric Vision\" style=\"width:150px;margin-bottom:16px\">\n        \n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#14243D\"><a data-footcity=\"\" href=\"afspraak.html#leuven\" style=\"color:inherit\">Leuven<\u002Fa><\u002Fh3>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #5B6C85; font-weight: 600\">Oogartsenpraktijk<\u002Fp><p style=\"margin:0;font-size:16px;line-height:1.65;color:#5B6C85\">Diestsesteenweg 104D<br>3010 Kessel-Lo<br>✆ 016 46 56 08<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#14243D\"><a data-footcity=\"\" href=\"afspraak.html#brussel\" style=\"color:inherit\">Brussel<\u002Fa><\u002Fh3>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #5B6C85; font-weight: 600\">Brussels Eye Doctors<\u002Fp><p style=\"margin:0;font-size:16px;line-height:1.65;color:#5B6C85\">Sint-Michielslaan 12-16<br>1150 Sint-Pieters-Woluwe<br>✆ 02 741 69 99<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#14243D\"><a data-footcity=\"\" href=\"afspraak.html#aarschot\" style=\"color:inherit\">Aarschot<\u002Fa><\u002Fh3>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #5B6C85; font-weight: 600\">Medisch Centrum Aarschot<\u002Fp><p style=\"margin:0;font-size:16px;line-height:1.65;color:#5B6C85\">Langdorpsesteenweg 129<br>3200 Aarschot<br>✆ 016 55 17 71<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1280px;margin:40px auto 0;padding-top:24px;border-top:1px solid #F1EAE1;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center\">\n      <a href=\"#\" style=\"font-size:15px;color:#5B6C85;display:inline-flex;align-items:center;min-height:44px\">Privacy Policy<\u002Fa>\n      <a href=\"faq.html\" style=\"font-size:15px;color:#5B6C85;display:inline-flex;align-items:center;min-height:44px\">FAQ<\u002Fa>\n      <span style=\"font-size:15px;color:#98A4B6;margin-left:auto\">© 2026 Pediatric Vision<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { menuOpen: false, langOpen: false, langCur: 'NL', shrunk: false };\n\n  goLang(l) {\n    if (l === this.state.langCur) { this.setState({ langOpen: false, menuOpen: false }); return; }\n    location.href = { NL: 'over-mij.html', EN: 'en-over-mij.html', FR: 'fr-over-mij.html' }[l] + location.search + location.hash;\n  }\n  componentDidMount() {\n    this.onScroll = () => {\n      const s = window.scrollY > 260;\n      if (s !== this.state.shrunk) this.setState({ shrunk: s });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    if (location.hash) setTimeout(() => { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 120 }); }, 350);\n    this.onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n  }\n  renderVals() {\n    const set = (o) => this.setState(o);\n    return {\n      shrunk: this.state.shrunk,\n      menuOpen: this.state.menuOpen,\n      langOpen: this.state.langOpen,\n      langCur: this.state.langCur,\n      toggleMenu: () => set({ menuOpen: !this.state.menuOpen, langOpen: false }),\n      toggleLang: () => set({ langOpen: !this.state.langOpen }),\n      mlangNL: 'border:0;border-radius:999px;padding:9px 11px;font-size:13px;min-width:42px;min-height:42px;' + (this.state.langCur === 'NL' ? 'background:#00788C;color:#FFFFFF;font-weight:600' : 'background:transparent;color:#5B6C85;font-weight:500'),\n      mlangEN: 'border:0;border-radius:999px;padding:9px 11px;font-size:13px;min-width:42px;min-height:42px;' + (this.state.langCur === 'EN' ? 'background:#00788C;color:#FFFFFF;font-weight:600' : 'background:transparent;color:#5B6C85;font-weight:500'),\n      pickNL: () => this.goLang('NL'),\n      pickEN: () => this.goLang('EN'),\n      pickFR: () => this.goLang('FR'),\n      mlangFR: 'border:0;border-radius:999px;padding:9px 11px;font-size:13px;min-width:42px;min-height:42px;' + (this.state.langCur === 'FR' ? 'background:#00788C;color:#FFFFFF;font-weight:600' : 'background:transparent;color:#5B6C85;font-weight:500')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
