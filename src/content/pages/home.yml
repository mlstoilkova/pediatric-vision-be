  firstVisit:
    badge: Comptez 1 à 1,5 heure
    title: La première consultation
    subtitle: À quoi vous attendre ?
    steps:
      - title: Gouttes oculaires
        text: Pour bien évaluer les yeux, nous utilisons des gouttes qui relâchent l’accommodation et dilatent la pupille. Ces gouttes doivent agir au moins 30 minutes.
      - title: Entretien d’accueil
        text: Avec l’anamnèse et les examens qui suivent, la consultation complète dure facilement une heure à une heure et demie.
      - title: Casquette/Lunettes de soleil
        text: "Les gouttes ne cessent pas d’agir immédiatement : votre enfant reste donc plus sensible à la lumière pendant quelques heures après la consultation. Une casquette et/ou des lunettes de soleil peuvent atténuer cette gêne."
    tipLead: Prévoyez donc suffisamment de temps !
    tipText: N’hésitez pas à apporter des collations et de l’eau, ainsi qu’un jeu de société ou un livre.
    faqPrompt: D’autres questions sur l’examen ?
    faqLabel: Consultez les questions fréquentes
    faqTopic: oogonderzoek
  about:
    eyebrow: À propos
    name: Dr Irina Balikova
    paragraphs:
      - Je suis ophtalmologue pédiatrique, spécialisée dans les affections oculaires pédiatriques et génétiques. J’ai développé mon expertise à l’Hôpital Universitaire des Enfants Reine Fabiola, à l’hôpital Erasme, à l’UZ Gent et à l’UZ Leuven.
      - Dans ma pratique, j’aborde chaque enfant avec calme et respect, avec une attention portée tant à l’enfant qu’aux parents.
    buttonLabel: En savoir plus sur moi
    image: ../../assets/uploads/dr-irina.jpg
    imageAlt: Dr Irina Balikova
  locations:
    title: Trois lieux de consultation
    intro: Je reçois les patients à Louvain, Bruxelles et Aarschot. Vous prenez rendez-vous directement auprès de la clinique de votre choix.
  articles:
    title: Prendre soin des yeux des enfants
    intro: Des informations sur les affections que je rencontre le plus souvent — écrites pour les parents.
    readLabel: Lire l’article
