  firstVisit:
    badge: Allow 1 to 1.5 hours
    title: The first consultation
    subtitle: What can you expect?
    steps:
      - title: Eye drops
        text: To assess the eyes properly, we use eye drops that relax focusing and widen the pupils. These drops need at least 30 minutes to take effect.
      - title: Intake consultation
        text: Together with the intake and the examinations that follow, the full consultation easily takes one to one and a half hours.
      - title: Cap/Sunglasses
        text: The drops don’t wear off straight away, so your child will be extra sensitive to light for a few hours after the consultation. A cap and/or sunglasses can help ease this discomfort.
    tipLead: So be sure to allow plenty of time!
    tipText: Feel free to bring some snacks and water, and a board game or a book.
    faqPrompt: More questions about the examination?
    faqLabel: See the frequently asked questions
    faqTopic: oogonderzoek
  about:
    eyebrow: About me
    name: Dr. Irina Balikova
    paragraphs:
      - I am a paediatric ophthalmologist specialising in paediatric and genetic eye conditions. I built my expertise at the Queen Fabiola Children’s University Hospital, Erasme Hospital, Ghent University Hospital and UZ Leuven.
      - In my practice, I approach every child calmly and respectfully, with attention for both the child and the parents.
    buttonLabel: Read more about me
    image: ../../assets/uploads/dr-irina.jpg
    imageAlt: Dr. Irina Balikova
  locations:
    title: Three locations
    intro: I see patients in Leuven, Brussels and Aarschot. You book an appointment directly with the clinic of your choice.
  articles:
    title: Children’s eye care
    intro: Background on the conditions I see most often — written for parents.
    readLabel: Read the article
