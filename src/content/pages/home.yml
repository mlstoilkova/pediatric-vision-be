  firstVisit:
    badge: Reken op 1 tot 1,5 uur
    title: De eerste raadpleging
    subtitle: Wat kunt u verwachten?
    steps:
      - title: Oogdruppels
        text: Om de ogen correct te kunnen evalueren gebruiken we oogdruppels die de accommodatie ontspannen en de pupil wijd maken. Deze druppels moeten tenminste 30 minuten inwerken.
      - title: Intakegesprek
        text: Samen met de intake en onderzoeken die we erna uitvoeren, duurt de volledige consultatie al gauw één tot anderhalf uur.
      - title: Petje/Zonnenbril
        text: De druppels zijn niet onmiddellijk uitgewerkt. Uw kind is daarna tot een paar uur na de consultatie extra gevoelig aan licht. Een petje en of zonnenbril kunnen helpen om dit ongemak te verminderen.
    tipLead: Voorzie zeker voldoende tijd!
    tipText: Neem gerust wat snacks en water mee, en een gezelschapsspel of boek.
    faqPrompt: Nog vragen over het onderzoek?
    faqLabel: Bekijk de veelgestelde vragen
    faqTopic: oogonderzoek
  about:
    eyebrow: Over mij
    name: Dr. Irina Balikova
    paragraphs:
      - Ik ben kinderoogarts, gespecialiseerd in pediatrische en genetische oogaandoeningen. Ik bouwde mijn expertise op in het Kinderziekenhuis Koningin Fabiola, het Erasme ziekenhuis, UZ Gent en UZ Leuven.
      - In mijn praktijk benader ik elk kind rustig en respectvol, met aandacht voor zowel het kind als de ouders.
    buttonLabel: Lees meer over mij
    image: ../../assets/uploads/dr-irina.jpg
    imageAlt: Dr. Irina Balikova
  locations:
    title: Drie locaties
    intro: Ik ontvang patiënten in Leuven, Brussel en Aarschot. Een afspraak maakt u rechtstreeks bij de kliniek van uw keuze.
  articles:
    title: Zorg voor kinderogen
    intro: Achtergrond bij de aandoeningen die ik het vaakst zie — geschreven voor ouders.
    readLabel: Lees het artikel
